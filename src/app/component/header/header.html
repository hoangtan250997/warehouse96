<div class="header">
  <div class="header-left">
    <div class="logo">
      <span class="logo-icon">◼ ◼<br />◼ ◼</span>
      <span class="logo-text">TEAM96.VN</span>
    </div>
  </div>

  <div class="header-center">
    <input type="text" class="search-bar" placeholder="Bạn muốn mua gì hôm nay..." />
  </div>

  <div class="header-right">
    <div class="user-section">
      <span class="user-icon">👤</span>
      <div class="user-text" *ngIf="!isLoggedIn()">
        <div>Login</div>
        <div>Register</div>
      </div>
      <div class="user-text" *ngIf="isLoggedIn()">
        <div class="logout-btn" (click)="logout()">Logout</div>
      </div>
    </div>

    <div class="notification">
      <span class="bell-icon">🔔</span>
    </div>
  </div>
</div>
