<div class="header">
  <div class="header-left">
    <div class="logo">
      <span class="logo-icon">◼ ◼<br />◼ ◼</span>
      <span class="logo-text">TEAM96.VN</span>
    </div>
  </div>

  <div class="header-center">
    <div class="search-wrap">
      <input type="text" class="search-bar" placeholder="Tìm kiếm sản phẩm..."
        [value]="productState.searchQuery()"
        (input)="onSearch($event)" />
      <span class="search-icon">🔍</span>
    </div>
  </div>

  <div class="header-right">
    <div class="user-section">
      <span class="user-icon">👤</span>
      <div class="user-text" *ngIf="!isLoggedIn()">
        <div>Login</div>
        <div>Register</div>
      </div>
      <div class="user-text" *ngIf="isLoggedIn()">
        <div>Xin chào, <strong>{{ getUsername() }}</strong></div>
        <div class="role-badge role-{{ getRole()?.toLowerCase() }}">{{ getRoleLabel() }}</div>
        <div class="logout-btn" (click)="logout()">Logout</div>
      </div>
    </div>

    <a *ngIf="isLoggedIn() && getRole() === 'MANAGER'" routerLink="/report" class="report-btn">📊 Báo cáo</a>

    <div class="notification">
      <span class="bell-icon">🔔</span>
    </div>
  </div>
</div>
