<div class="header">
  <div class="header-left">
    <div class="logo">
      <span class="logo-badge">96</span>
      <span class="logo-text">TEAM96<span class="logo-dot">.VN</span></span>
    </div>
  </div>

  <div class="header-center">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" class="search-bar" placeholder="Tìm kiếm sản phẩm..."
        [value]="productState.searchQuery()"
        (input)="onSearch($event)" />
    </div>
  </div>

  <div class="header-right">
    <div class="backend-switch" title="Máy chủ API (chuyển sẽ đăng xuất và tải lại)">
      <span class="backend-switch-icon">🔌</span>
      <select class="backend-select" [value]="currentBackend()" (change)="switchBackend($event)">
        <option value="python">Python</option>
        <option value="php">PHP</option>
      </select>
    </div>

    <a *ngIf="isLoggedIn() && getRole() === 'MANAGER'" routerLink="/report" class="report-btn">📊 Báo cáo</a>

    <div class="notification" title="Thông báo">
      <span class="bell-icon">🔔</span>
      <span class="notification-dot"></span>
    </div>

    <div class="user-section">
      <span class="user-avatar" *ngIf="!isLoggedIn()">👤</span>
      <span class="user-avatar avatar-initial" *ngIf="isLoggedIn()">{{ (getUsername() || '?').charAt(0).toUpperCase() }}</span>
      <div class="user-text" *ngIf="!isLoggedIn()">
        <div>Login</div>
        <div>Register</div>
      </div>
      <div class="user-text" *ngIf="isLoggedIn()">
        <div class="user-name">Xin chào, <strong>{{ getUsername() }}</strong></div>
        <div class="role-badge role-{{ getRole()?.toLowerCase() }}">{{ getRoleLabel() }}</div>
      </div>
      <div class="logout-btn" *ngIf="isLoggedIn()" (click)="logout()" title="Đăng xuất">Đăng xuất</div>
    </div>
  </div>
</div>
