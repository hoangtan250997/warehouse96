<div class="product-section">
  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <span>Đang tải sản phẩm...</span>
  </div>

  <div *ngIf="error" class="error-state">
    <span class="error-icon">&#9888;</span>
    {{ error }}
  </div>

  <ng-container *ngIf="response as res">
    <div class="product-grid">
      <div class="product-card" *ngFor="let item of res.items">
        <div class="product-img">
          <span class="product-img-icon">&#128241;</span>
          <span class="stock-badge" [class.stock-badge-empty]="getStock(item.id) === 0">
            {{ getStock(item.id) > 0 ? 'Còn ' + getStock(item.id) : 'Hết hàng' }}
          </span>
        </div>
        <div class="product-body">
          <div class="product-label">{{ item.label }}</div>
          <div class="product-code" *ngIf="item.code">{{ item.code }}<ng-container *ngIf="item.model"> · {{ item.model }}</ng-container></div>
          <div class="product-meta">
            <span class="product-price">{{ formatPrice(item.current_price) }}</span>
            <span class="product-unit">/ cái</span>
          </div>
          <div class="quantity-control" *ngIf="role !== 'ACCOUNTANT'">
            <button class="qty-btn" (click)="decrement(item.id)" [disabled]="getQuantity(item.id) === 0">−</button>
            <span class="qty-value">{{ getQuantity(item.id) }}</span>
            <button class="qty-btn" (click)="increment(item.id)">+</button>
          </div>
          <div class="card-actions">
            <button class="create-order-btn" *ngIf="role === 'SALES' || role === 'MANAGER'"
              (click)="onAddToCart(item)" [disabled]="getQuantity(item.id) === 0 || getStock(item.id) === 0 || getQuantity(item.id) > getStock(item.id)">
              ↗ Tạo phiếu xuất
            </button>
            <button class="create-receipt-btn" *ngIf="role === 'WAREHOUSE_STAFF' || role === 'MANAGER'"
              (click)="onCreateReceipt(item)" [disabled]="getQuantity(item.id) === 0">
              ↙ Tạo phiếu nhập
            </button>
            <button class="edit-price-btn" *ngIf="role === 'ACCOUNTANT' || role === 'MANAGER'"
              (click)="onEditPrice(item)">
              ✎ Sửa giá
            </button>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</div>
