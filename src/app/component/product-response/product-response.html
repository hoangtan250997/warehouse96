<div class="product-section">
  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <span>Đang tải sản phẩm...</span>
  </div>

  <div *ngIf="error" class="error-state">
    <span class="error-icon">&#9888;</span>
    {{ error }}
  </div>

  <ng-container *ngIf="response as res">
    <div class="product-grid">
      <div class="product-card" *ngFor="let item of res.items">
        <div class="product-img">&#128241;</div>
        <div class="product-body">
          <div class="product-label">{{ item.label }}</div>
          <div class="product-meta">
            <span class="product-unit">/ cái</span>
            <span class="product-price">{{ formatPrice(item.current_price) }}</span>
          </div>
          <div class="stock-info">Tồn kho: <strong>{{ getStock(item.id) }}</strong></div>
          <div class="quantity-control">
            <button class="qty-btn" (click)="decrement(item.id)" [disabled]="getQuantity(item.id) === 0">−</button>
            <span class="qty-value">{{ getQuantity(item.id) }}</span>
            <button class="qty-btn" (click)="increment(item.id)">+</button>
          </div>
          <div class="card-actions">
            <button class="create-order-btn" (click)="onAddToCart(item)" [disabled]="getQuantity(item.id) === 0">
              Tạo phiếu xuất
            </button>
            <button class="create-receipt-btn" (click)="onCreateReceipt(item)">
              Tạo phiếu nhập
            </button>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</div>
