<div class="login-wrapper">
<section class="login-page">
  <div class="login-brand">
    <span class="login-logo">96</span>
    <h1>TEAM96<span class="brand-dot">.VN</span></h1>
    <p class="login-tagline">Hệ thống quản lý kho hàng</p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="submitLogin($event)">
    <label>
      Username
      <input type="text" formControlName="username" placeholder="Tên đăng nhập" autocomplete="username" />
      <div
        *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
        class="field-error"
      >
        Username is required.
      </div>
    </label>

    <label>
      Password
      <input type="password" formControlName="password" placeholder="Mật khẩu" autocomplete="current-password" />
      <div
        *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        class="field-error"
      >
        Password is required.
      </div>
    </label>

    <button type="submit" [disabled]="loginLoading()">
      {{ loginLoading() ? 'Đang đăng nhập…' : 'Đăng nhập' }}
    </button>
  </form>

  <div *ngIf="loginLoading()" class="status">Logging in…</div>
  <div *ngIf="loginError()" class="error">{{ loginError() }}</div>
  <pre *ngIf="loginResponse()">{{ loginResponse() | json }}</pre>
</section>
</div>
